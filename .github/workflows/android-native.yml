name: Android Native

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/android/**'
      - '.github/workflows/android-native.yml'

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check the message catalogs
        run: |
          bun packages/android/tools/generate-catalogs.mjs
          git diff --exit-code -- packages/android/app/src/main/assets/i18n

      - name: Build debug APK
        working-directory: packages/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchamber-android-native-debug-apk
          path: packages/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
