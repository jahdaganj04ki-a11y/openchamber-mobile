name: Android Native

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/android/**'
      - '.github/workflows/android-native.yml'

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build debug APK
        working-directory: packages/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchamber-android-native-debug-apk
          path: packages/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  bun-android-spike:
    name: Bun on Android (spike 0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Compile the spike for a phone
        run: |
          mkdir -p out
          bun build --compile --target=bun-linux-aarch64-android \
            packages/android/tools/spikes/bun-android.ts --outfile out/bun-android-arm64
          file out/bun-android-arm64

      - name: Compile the spike for the emulator
        run: |
          bun build --compile --target=bun-linux-x64-android \
            packages/android/tools/spikes/bun-android.ts --outfile out/bun-android-x64
          file out/bun-android-x64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchamber-bun-android-arm64
          path: out/bun-android-arm64
          if-no-files-found: error

      - name: Start the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: packages/android/tools/spikes/run-bun-android.sh
