name: Android Spikes

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/android/tools/spikes/**'
      - '.github/workflows/android-spikes.yml'

concurrency:
  group: android-spikes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-android:
    name: Bun on Android (spike 0.1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Compile the spike for a phone
        run: |
          mkdir -p out
          bun build --compile --target=bun-linux-aarch64-android \
            packages/android/tools/spikes/bun-android.ts --outfile out/bun-android-arm64
          file out/bun-android-arm64

      - name: Compile the spike for the emulator
        run: |
          bun build --compile --target=bun-linux-x64-android \
            packages/android/tools/spikes/bun-android.ts --outfile out/bun-android-x64
          file out/bun-android-x64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchamber-bun-android-arm64
          path: out/bun-android-arm64
          if-no-files-found: error

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Start the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: SPIKE_BINARY=${{ github.workspace }}/out/bun-android-x64 bash packages/android/tools/spikes/run-bun-android.sh

  opencode-android:
    name: OpenCode on Android (spike 0.2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check out opencode
        run: |
          git clone --depth 1 --branch v2.0.32 https://github.com/anomalyco/opencode.git opencode

      - name: Install the dependencies
        working-directory: opencode
        run: |
          bun install
          bun install --os="*" --cpu="*" \
            "@opentui/core@$(bun -e 'console.log(require("./packages/cli/package.json").dependencies["@opentui/core"])')" \
            "@opencode-ai/pty@$(bun -e 'console.log(require("./packages/cli/package.json").dependencies["@opencode-ai/pty"])')"

      - name: Compile the engine for a phone
        working-directory: opencode/packages/cli
        run: |
          bun build --compile --target=bun-linux-aarch64-android \
            ./src/index.ts --outfile ../../../out/opencode-android-arm64
          file ../../../out/opencode-android-arm64

      - name: Compile the engine for the emulator
        working-directory: opencode/packages/cli
        run: |
          bun build --compile --target=bun-linux-x64-android \
            ./src/index.ts --outfile ../../../out/opencode-android-x64
          file ../../../out/opencode-android-x64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchamber-opencode-android-arm64
          path: out/opencode-android-arm64
          if-no-files-found: error

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Start the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: SPIKE_BINARY=${{ github.workspace }}/out/opencode-android-x64 bash packages/android/tools/spikes/run-opencode-android.sh
